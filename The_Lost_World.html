    /* Smooth Accordion */

    const CHAPTERS_DATA = {
      1: {
        number: 1,
        title: "Chapter 1: A Dream of Adventure",
        subtitle: "Edward Malone's quest for courage, Gladys's challenge, and the risky plan to meet Professor Challenger.",
        summaryPoints: [
          "Edward Malone is a 23-year-old reporter for the Daily Gazette in London, full of energy and eager for a meaningful life.",
          "He proposes marriage to Gladys Hungerton, who values their friendship but says she could only love a brave man who has faced danger and traveled into the unknown.",
          "Gladys explains that true courage comes from a man's character, not from acting merely to impress someone else.",
          "Inspired by her words, Malone visits his editor, Mr. McArdle, the next evening and asks for a dangerous assignment.",
          "McArdle assigns Malone to investigate Professor George Edward Challenger, a brilliant but aggressive zoologist who returned from South America claiming unknown creatures exist.",
          "Because Challenger hates journalists and throws them out of his house, Malone consults his friend Tarp Henry at the Savage Club.",

        ],
        paragraphs: [
          {
            en: `My name is <span class="hl-char">Edward Malone</span>, and at the time this story began I was a <span class="hl-vocab">young reporter</span> on the <span class="hl-idea">Daily Gazette in London</span>. I was <span class="hl-char">twenty-three, full of energy</span>, and certain that <span class="hl-idea">a great life was waiting for me</span>. The problem was that <span class="hl-cause">I had no idea how to begin it</span>.`,
            ar: `اسمي إدوارد مالون، وفي الوقت الذي بدأت فيه هذه القصة كنت مراسلًا صحفيًا شابًا في صحيفة «ديلي جازيت» في لندن. كنت في الثالثة والعشرين من عمري، مفعمًا بالحيوية، وموقنًا بأن حياة عظيمة تنتظرني. وكانت المشكلة أنني لم أكن أعرف كيف أبدأها.`
          },
          {
            en: `There was also <span class="hl-char">Gladys Hungerton</span>. I <span class="hl-vocab">admired</span> her more than anyone I had ever met, and one evening <span class="hl-idea">I finally asked her to marry me</span>. She did not laugh at me or become angry. Instead, she looked <span class="hl-vocab">serious</span> and told me that <span class="hl-cause">she valued our friendship</span> but <span class="hl-exam">did not love me in the way I hoped</span>.`,
            ar: `كانت هناك أيضًا جلاديس هانجرتون. كنت معجبًا بها أكثر من أي شخص قابلته في حياتي، وفي إحدى الأمسيات طلبت منها الزواج أخيرًا. لم تضحك مني ولم تغضب. وبدلًا من ذلك، بدت جادة وأخبرتني أنها تقدّر صداقتنا لكنها لا تحبني بالطريقة التي كنت أتمناها.`
          },
          {
            en: `"What kind of man could you love?" I asked. Gladys thought for a moment. "<span class="hl-exam">A man who has done something brave</span>," she said. "Someone who has <span class="hl-idea">faced danger</span>, <span class="hl-vocab">traveled into the unknown</span>, and <span class="hl-char">proved that he can act when it matters</span>."`,
            ar: `سألتها: «أي نوع من الرجال يمكنكِ أن تحبي؟» فكرت جلاديس للحظة ثم قالت: «رجلٌ قام بعمل شجاع؛ شخصٌ واجه الخطر، وسافر إلى المجهول، وأثبت أنه يستطيع التصرف عندما يتطلب الأمر ذلك».`
          },
          {
            en: `I tried to <span class="hl-vocab">joke</span>. "So, I must discover a new country before you will consider me?" "Not for me," she replied. "<span class="hl-exam">If a man is truly brave, he does not act just to impress someone else.</span> He acts because <span class="hl-char">courage is part of his character</span>."`,
            ar: `حاولتُ أن أمزح قائلًا: «إذن، يجب أن أكتشف بلدًا جديدًا قبل أن تفكري بي؟» فأجابت: «ليس من أجلي؛ فإذا كان الرجل شجاعًا حقًا، فإنه لا يتصرف لمجرد إبهار شخص آخر، بل يتصرف لأن الشجاعة جزء من شخصيته».`
          },
          {
            en: `<span class="hl-cause">Her words stayed with me.</span> I left her house feeling <span class="hl-char">disappointed, but also strangely excited</span>. <span class="hl-idea">London suddenly seemed too safe.</span> I wanted a <span class="hl-vocab">challenge</span> - something that would test me and <span class="hl-exam">give my life a clearer purpose</span>.`,
            ar: `ظلت كلماتها عالقة في ذهني. غادرتُ منزلها وأنا أشعر بخيبة أمل، ولكن بحماس غريب في الوقت نفسه. بدت لندن فجأة آمنة أكثر من اللازم. أردتُ تحديًا — شيئًا يختبرني ويمنح حياتي هدفًا أكثر وضوحًا.`
          },
          {
            en: `The next evening, I <span class="hl-vocab">went straight to</span> my <span class="hl-vocab">editor</span>, <span class="hl-char">Mr. McArdle</span>. He was an <span class="hl-char">experienced newspaper man</span> who had seen every kind of young reporter. When I asked him to send me on a <span class="hl-exam">dangerous assignment</span>, he pushed his glasses up and <span class="hl-vocab">stared at</span> me. "You want danger?" he said. "<span class="hl-idea">Most sensible people want to avoid it.</span>" "I want a real story, sir. Something difficult." He studied me for a moment, then smiled. "Perhaps I do have a job for you. Have you heard of <span class="hl-char">Professor George Edward Challenger</span>?"`,
            ar: `في المساء التالي، توجهتُ مباشرةً إلى رئيس تحريري، السيد مكاردل. كان رجل صحافة خبيرًا رأى كل أنواع المراسلين الشباب. وعندما طلبتُ منه إرسالي في مهمة خطيرة، رفع نظارته وحدّق فيّ قائلًا: «أتريد الخطر؟ معظم العقلاء يريدون تجنبه». فقلت: «أريد قصة حقيقية يا سيدي، شيئًا صعبًا». تأملني للحظة ثم ابتسم وقال: «ربما لديّ عمل يناسبك بالفعل. هل سمعت عن البروفيسور جورج إدوارد تشالنجر؟»`
          },
          {
            en: `Of course I had. Almost everyone in the newspaper world knew his name. Challenger was a <span class="hl-char">famous zoologist, brilliant but extremely difficult</span>. He had recently returned from <span class="hl-idea">South America</span> with an <span class="hl-vocab">extraordinary</span> story about <span class="hl-idea">unknown animals</span>. When scientists <span class="hl-vocab">questioned</span> him, he <span class="hl-cause">refused to give clear details</span>. When reporters tried to interview him, he <span class="hl-exam">often threw them out of his house - sometimes literally</span>.`,
            ar: `بالطبع سمعت عنه، فكل شخص تقريبًا في عالم الصحافة يعرف اسمه. كان تشالنجر عالم حيوان شهيرًا، بارعًا لكنه صعب المراس للغاية. وكان قد عاد مؤخرًا من أمريكا الجنوبية بقصة استثنائية عن حيوانات مجهولة. وعندما استجوبه العلماء، رفض تقديم تفاصيل واضحة، وعندما حاول الصحفيون إجراء مقابلات معه، كان غالبًا ما يطردهم خارج منزله — حرفيًا في بعض الأحيان.`
          },
          {
            en: `"Do you want me to interview him?" I asked. "If you can <span class="hl-vocab">get through</span> the front door," McArdle replied. "Two years ago, Challenger <span class="hl-idea">traveled alone through a little-known part of South America</span>. He came back claiming that something remarkable had happened. He had <span class="hl-exam">damaged photographs, strange sketches, and a few pieces of evidence</span>, but he <span class="hl-cause">would not reveal the exact place</span>. Most people think he is <span class="hl-vocab">either mistaken or lying</span>. Find out which."`,
            ar: `سألتُ: «هل تريد مني أن أجري معه مقابلة؟» أجاب مكاردل: «إن استطعتَ عبور الباب الأمامي. قبل عامين، سافر تشالنجر بمفرده عبر جزء قليل الشهرة من أمريكا الجنوبية، وعاد مدعيًا أن شيئًا مذهلًا قد حدث. كانت لديه صور تالفة، ورسومات غريبة، وبضع قطع من الأدلة، لكنه رفض الكشف عن المكان الدقيق. يعتقد معظم الناس أنه إما مخطئ أو كاذب. اكتشف أيّهما الصحيح».`
          },
          {
            en: `This was exactly the kind of chance I had been looking for. Yet there was one problem: <span class="hl-cause">Challenger hated journalists</span>. If I arrived <span class="hl-vocab">honestly</span> and said I worked for the Gazette, <span class="hl-exam">the interview would probably end before it began</span>.`,
            ar: `كانت هذه بالضبط الفرصة التي كنت أبحث عنها. ومع ذلك، كانت هناك مشكلة واحدة: تشالنجر يكره الصحفيين. فلو وصلتُ بصدق وقلتُ إنني أعمل لصالح صحيفة «جازيت»، لربما انتهت المقابلة قبل أن تبدأ.`
          },
          {
            en: `That night I went to the <span class="hl-idea">Savage Club</span>, where many writers and scientists met. I found my friend <span class="hl-char">Tarp Henry</span>, who worked for a <span class="hl-vocab">scientific journal</span>, and asked what he knew about Challenger. "He is clever," Henry said, "but impossible. He <span class="hl-vocab">argues with</span> everyone. At a <span class="hl-idea">scientific meeting in Vienna</span>, he almost started a <span class="hl-vocab">battle</span> over a <span class="hl-vocab">theory of evolution</span>. If you want to speak to him, <span class="hl-exam">do not mention newspapers</span>."`,
            ar: `في تلك الليلة ذهبتُ إلى نادي «سافاج»، حيث يلتقي العديد من الكتّاب والعلماء. وجدتُ صديقي تارب هنري، الذي يعمل في مجلة علمية، وسألته عما يعرفه عن تشالنجر. فقال هنري: «إنه ذكي، لكن التعامل معه مستحيل؛ فهو يتجادل مع الجميع. وفي اجتماع علمي في فيينا، كاد يبدأ معركة بسبب نظرية التطور. إذا أردت التحدث إليه، فلا تذكر الصحف أبدًا».`
          },
          {
            en: `That <span class="hl-vocab">gave me an idea</span>. I asked Henry to find <span class="hl-idea">Challenger's latest scientific paper</span>. It was full of <span class="hl-vocab">technical language</span> I <span class="hl-vocab">barely</span> understood, but I <span class="hl-cause">copied one complicated sentence</span> and used it in a letter. I <span class="hl-exam">pretended to be a young student</span> who admired Challenger's work but had a question about one of his arguments. Henry read the letter and laughed. "<span class="hl-vocab">You are taking a risk</span>, Malone. He may realize at once that you know nothing about the subject." "I only need to get inside his study," I said. "After that, I will <span class="hl-vocab">take my chance</span>."`,
            ar: `أعطاني ذلك فكرة. طلبتُ من هنري أن يجد أحدث بحث علمي لتشالنجر. كان البحث مليئًا بلغة تقنية بالكاد فهمتها، لكنني نسختُ جملة معقدة واحدة واستخدمتها في رسالة. وتظاهرتُ بأنني طالب شاب معجب بعمل تشالنجر ولديّ سؤال حول إحدى حججه. قرأ هنري الرسالة وضحك قائلًا: «أنت تخاطر يا مالون، فقد يدرك فورًا أنك لا تعرف شيئًا عن الموضوع». فقلت: «أحتاج فقط إلى الدخول إلى غرفة مكتبه، وبعد ذلك سأغتنم فرصتي».`
          },
          {
            en: `Two days later a reply arrived. The handwriting looked as <span class="hl-vocab">aggressive</span> as the man himself. Challenger wrote that <span class="hl-cause">my question showed poor understanding</span>, but he was <span class="hl-vocab">willing</span> to <span class="hl-vocab">explain the matter in person</span>. He gave me an <span class="hl-vocab">appointment</span> for <span class="hl-idea">eleven o'clock on Wednesday morning</span>.`,
            ar: `بعد يومين وصل الرد. بدا خط اليد عدوانيًا تمامًا مثل الرجل نفسه. كتب تشالنجر أن سؤالي يُظهر فهمًا ضعيفًا، لكنه مستعد لشرح الأمر شخصيًا، وحدد لي موعدًا في الساعة الحادية عشرة من صباح يوم الأربعاء.`
          },
          {
            en: `I should have been nervous. Instead, I felt as if <span class="hl-char">my real life had finally begun</span>. On Wednesday I traveled to Professor Challenger's large house in <span class="hl-idea">Kensington</span>. A quiet <span class="hl-vocab">servant</span> named <span class="hl-char">Austin</span> opened the door. Before he could take me to the study, a <span class="hl-char">small, lively woman</span> stopped me in the hall. "You have come to see my husband?" she asked. "Yes, <span class="hl-char">Mrs. Challenger</span>." She <span class="hl-vocab">lowered her voice</span>. "Then I should warn you. George is a <span class="hl-exam">perfectly impossible person</span>. If he becomes angry, do not argue too long. <span class="hl-exam">Leave the room while you still can</span>."`,
            ar: `كان ينبغي أن أكون متوترًا، ولكن بدلًا من ذلك شعرتُ وكأن حياتي الحقيقية قد بدأت أخيرًا. يوم الأربعاء سافرتُ إلى منزل البروفيسور تشالنجر الكبير في كينسينجتون. فتح الباب خادم هادئ يُدعى أوستن. وقبل أن يتمكن من اصطحابي إلى غرفة المكتب، أوقفتني امرأة صغيرة مفعمة بالحيوية في الردهة. سألت: «هل أتيت لرؤية زوجي؟» أجبت: «نعم، يا سيدة تشالنجر». فخفضت صوتها وقالت: «إذن يجب أن أحذرك؛ فجورج شخص مستحيل التعامل تمامًا. إذا غضب، فلا تجادله طويلًا، وغادر الغرفة بينما لا تزال قادرًا على ذلك».`
          },
          {
            en: `I smiled, but her <span class="hl-vocab">expression</span> told me she was serious. A deep voice suddenly <span class="hl-vocab">roared</span> from behind a closed door. Austin opened it, and I entered. Professor Challenger sat behind a wide desk covered with <span class="hl-idea">books, maps, fossils, and papers</span>. He was <span class="hl-char">shorter than I expected, but enormously broad</span>. His <span class="hl-char">black beard spread across his chest</span>, and his <span class="hl-char">sharp grey-blue eyes seemed to measure every weakness in me</span>. "Well?" he demanded. "You are the young man who has difficulty understanding <span class="hl-vocab">plain</span> science?" I had entered looking for adventure. <span class="hl-exam">I had found it sooner than I expected.</span>`,
            ar: `ابتسمتُ، لكن تعبير وجهها أخبرني أنها جادة. وفجأة زأر صوت عميق من خلف باب مغلق. فتح أوستن الباب، فدخلتُ. كان البروفيسور تشالنجر جالسًا خلف مكتب عريض مغطى بالكتب والخرائط والحفريات والأوراق. كان أقصر مما توقعت، لكنه عريض البنية بشكل هائل، ولحيته السوداء تمتد على صدره، وعيناه الحادتان الرماديتان المزرقتان تبدوان وكأنهما تقيسان كل نقطة ضعف فيّ. سأل بلهجة آمرة: «حسنًا؟ أنت الشاب الذي يجد صعوبة في فهم العلم الواضح؟» كنت قد دخلتُ أبحث عن المغامرة، فوجدتها في وقت أقرب مما كنت أتوقع.`
          }

      2: {
        number: 2,
        title: "Chapter 2: Professor Challenger's Secret",
        subtitle: "The exposure of Malone's trick, a fierce fight, earned respect, and the astonishing evidence of a prehistoric world.",
        summaryPoints: [
          "Challenger questions Malone on the scientific article and quickly exposes that Malone knows nothing about the subject.",
          "Malone admits he is a reporter for the Daily Gazette; Challenger explodes with rage and attacks him.",
          "They wrestle out into the hallway and roll through the open front door onto the outside steps.",
          "A policeman arrives, noticing Malone's swelling eye and Challenger's torn coat, but Malone refuses to press charges, admitting it was partly his fault.",
          "Impressed by Malone's honesty and courage, Challenger invites him back into the study on the condition that he publishes nothing without permission.",
          "Challenger reveals the worn sketchbook of Maple White, a dying American explorer he found in a remote Amazon village two years earlier.",
          "The sketchbook shows high red cliffs, a separate rock tower with a tree on top, and a massive animal matching a prehistoric stegosaurus.",
          "Challenger explains he followed White's route, found the red cliffs, and took photographs—most of which were ruined in a river accident.",
          "Challenger shows Malone a damaged photo of the rock tower with a dark winged creature, plus an actual curved wing bone with dried membrane from a pterodactyl.",
          "Challenger explains his isolation theory: the high cliffs cut off the plateau for millions of years, allowing prehistoric species to survive.",
          "Challenger invites Malone to attend a public lecture at the Zoological Institute the next evening, leaving Malone beginning to believe the story."
        ],
        paragraphs: [
          {
            en: `Professor Challenger began by <span class="hl-vocab">asking me questions</span> about the <span class="hl-idea">scientific article</span> I had mentioned in my letter. At first I tried to answer <span class="hl-vocab">confidently</span>, but the questions became more <span class="hl-vocab">technical</span> every minute. "And what do you think of the <span class="hl-vocab">recent evidence</span>?" he asked. "Very interesting," I said carefully. "Which evidence?" <span class="hl-cause">I hesitated.</span> His eyes narrowed. "<span class="hl-exam">You know nothing about this subject.</span>"`,
            ar: `بدأ البروفيسور تشالنجر بطرح أسئلة عليّ حول المقال العلمي الذي ذكرته في رسالتي. في البداية حاولتُ الإجابة بثقة، لكن الأسئلة أصبحت أكثر تقنية في كل دقيقة. سألني: «وما رأيك في الأدلة الحديثة؟» فقلت بحذر: «مثيرة للاهتمام للغاية». فسأل: «أيّ أدلة؟» ترددتُ، فضاقت عيناه وقال: «أنت لا تعرف شيئًا عن هذا الموضوع».`
          },
          {
            en: `<span class="hl-vocab">There was no point pretending</span> any longer. "Very little," I admitted. "Then why are you here?" I <span class="hl-vocab">took a breath</span>. "<span class="hl-exam">I am a reporter for the Daily Gazette.</span>" For one silent second, nothing happened. Then Challenger <span class="hl-char">rose from his chair like a storm</span>. "<span class="hl-cause">A journalist! In my house!</span>"`,
            ar: `لم يعد هناك جدوى من التظاهر أكثر من ذلك. اعترفتُ قائلًا: «القليل جدًا». فسأل: «إذن لماذا أنت هنا؟» أخذتُ نفسًا وقلت: «أنا مراسل لصحيفة ديلي جازيت». لثانية صامتة واحدة لم يحدث شيء، ثم نهض تشالنجر من كرسيه كالعاصفة صارخًا: «صحفي! في منزلي!»`
          },
          {
            en: `I moved towards the door. "I came because <span class="hl-vocab">the public</span> wants to understand what happened in South America." "The public!" he roared. "<span class="hl-char">You mean people who laugh before they listen.</span> Out!" He came towards me. I told him <span class="hl-vocab">firmly</span> not to touch me. He ignored the warning. A moment later we were <span class="hl-idea">struggling in the hallway, crashing into a chair and rolling through the open front door</span>. We landed together on the steps outside.`,
            ar: `تحركتُ نحو الباب وقلت: «أتيتُ لأن الجمهور يريد أن يفهم ما حدث في أمريكا الجنوبية». فزأر قائلًا: «الجمهور! تقصد الناس الذين يضحكون قبل أن يستمعوا. اخرج!» وتقدم نحوي. أخبرته بحزم ألا يلمسني، لكنه تجاهل التحذير. وبعد لحظة كنا نتصارع في الردهة، ونرتطم بكرسي ونتدحرج عبر الباب الأمامي المفتوح، لنسقط معًا على الدرجات في الخارج.`
          },
          {
            en: `A policeman hurried over. Several neighbors stopped to watch. "What happened?" the policeman asked. My eye was beginning to <span class="hl-vocab">swell</span>, and Challenger's coat was <span class="hl-vocab">torn</span>. I could easily have made a complaint. Instead, I remembered that <span class="hl-cause">I had entered his house under a false name and had deliberately tricked him</span>. "<span class="hl-exam">It was partly my fault</span>," I said. "<span class="hl-exam">I will not press charges.</span>" The policeman looked surprised, but closed his notebook. Challenger stared at me. <span class="hl-cause">The anger in his face changed into something almost like respect.</span> "Come back inside," he said. I followed him, wondering whether I was <span class="hl-char">brave or simply foolish</span>.`,
            ar: `أسرع شرطي نحونا، وتوقف عدة جيران للمشاهدة. سأل الشرطي: «ماذا حدث؟» كانت عيني قد بدأت تتورم، ومعطف تشالنجر قد تمزق. كان بإمكاني بسهولة تقديم شكوى، لكنني تذكرتُ أنني دخلتُ منزله باسم مستعار وخدعته عمدًا. فقلت: «كان الخطأ خطئي جزئيًا، ولن أرفع دعوى قضائية». بدا الشرطي مندهشًا لكنه أغلق دفتره. حدّق تشالنجر فيّ، وتحوّل الغضب في وجهه إلى شيء يشبه الاحترام تقريبًا، وقال: «عُد إلى الداخل». تبعته وأنا أتساءل إن كنتُ شجاعًا أم مجرد أحمق.`
          },
          {
            en: `Back in the study, Challenger closed the door and became suddenly serious. "<span class="hl-char">You behaved better than I would expect from a reporter</span>," he said. "Perhaps I will show you something. But <span class="hl-exam">you must promise not to publish it without my permission</span>." I <span class="hl-vocab">gave him my word</span>. He opened a worn <span class="hl-vocab">sketchbook</span>. "Two years ago I traveled through the Amazon region to study animal life. In a remote village I found a <span class="hl-vocab">dying</span> American named <span class="hl-char">Maple White</span>. He had reached the village alone after terrible <span class="hl-vocab">hardship</span>. He died before I could question him."`,
            ar: `وبالعودة إلى غرفة المكتب، أغلق تشالنجر الباب وأصبح جادًا فجأة. قال: «لقد تصرفتَ بشكل أفضل مما كنت أتوقع من صحفي. ربما أريك شيئًا، ولكن يجب أن تعدني بألا تنشره دون إذني». أعطيته كلمتي، ففتح دفتر رسم باليًا وقال: «قبل عامين سافرتُ عبر منطقة الأمازون لدراسة الحياة الحيوانية، وفي قرية نائية وجدتُ أمريكيًا محتضرًا يُدعى مابل وايت. كان قد وصل إلى القرية بمفرده بعد مشقة رهيبة، وتوفي قبل أن أتمكن من استجوابه».`
          },
          {
            en: `Among White's <span class="hl-vocab">belongings</span>, Challenger had found the sketchbook. Most of the early pages showed ordinary river scenes, plants, people, and animals. Then the drawings changed. One picture showed <span class="hl-idea">a line of high red cliffs rising above thick forest</span>. The cliffs seemed to form an <span class="hl-vocab">enormous natural wall</span>. Another showed a <span class="hl-idea">separate rock tower standing near them</span>. On top was a tree. "A strange <span class="hl-vocab">landscape</span>," I said, "but hardly impossible." "Continue."`,
            ar: `بين ممتلكات وايت، عثر تشالنجر على دفتر الرسم. أظهرت معظم الصفحات الأولى مشاهد نهرية عادية ونباتات وناسًا وحيوانات، ثم تغيرت الرسومات. أظهرت إحدى الصور صفًا من المنحدرات الحمراء العالية التي ترتفع فوق غابة كثيفة، وبدت المنحدرات وكأنها تشكل جدارًا طبيعيًا هائلًا. وأظهرت صورة أخرى برجًا صخريًا منفصلًا يقف بالقرب منها، وعلى قمته شجرة. قلت: «منظر طبيعي غريب، لكنه ليس مستحيلًا». فقال: «تابع».`
          },
          {
            en: `The next drawing stopped me. It showed a <span class="hl-idea">huge animal with a heavy body, long tail, and plates rising along its back</span>. "What is that?" "That," said Challenger, "is the question. Maple White drew what he saw." He opened a <span class="hl-vocab">reference book</span> and showed me an <span class="hl-vocab">illustration</span> of a <span class="hl-exam">prehistoric stegosaurus</span>. The similarity was remarkable. "<span class="hl-char">A man can draw anything</span>," I said. "Of course. Which is why I went to find the place myself."`,
            ar: `أوقفتني الرسمة التالية؛ فقد أظهرت حيوانًا ضخمًا ذا جسم ثقيل وذيل طويل وصفائح ترتفع على طول ظهره. سألت: «ما هذا؟» فقال تشالنجر: «هذا هو السؤال. لقد رسم مابل وايت ما رآه». فتح كتابًا مرجعيًا وأراني رسمًا توضيحيًا لديناصور ستيجوصور من عصور ما قبل التاريخ، وكان التشابه مذهلًا. قلت: «يمكن للإنسان أن يرسم أي شيء». فأجاب: «بالطبع، ولهذا السبب ذهبتُ للعثور على المكان بنفسي».`
          },
          {
            en: `Challenger explained that he <span class="hl-idea">followed White's route using clues in the sketchbook</span>. After weeks of travel, he found the red cliffs. He could not climb onto the high <span class="hl-vocab">plateau</span>, but he saw extraordinary <span class="hl-vocab">creatures</span> there. He took photographs, though <span class="hl-cause">most were damaged later in a river accident</span>. He showed me one photograph. The <span class="hl-vocab">image</span> was unclear, but I could see the cliffs and the isolated rock tower. On the tree at the top appeared a <span class="hl-idea">large dark shape</span>. "A bird?" I suggested. Challenger <span class="hl-vocab">shook his head</span>. "Look more closely."`,
            ar: `أوضح تشالنجر أنه تتبع مسار وايت مستخدمًا الأدلة الموجودة في دفتر الرسم. وبعد أسابيع من السفر، وجد المنحدرات الحمراء. لم يستطع تسلق الهضبة المرتفعة، لكنه رأى مخلوقات استثنائية هناك. التقط صورًا فوتوغرافية، رغم أن معظمها تلف لاحقًا في حادث نهري. أراني صورة واحدة؛ كانت غير واضحة، لكنني استطعتُ رؤية المنحدرات والبرج الصخري المنعزل، وعلى الشجرة في القمة ظهر شكل داكن كبير. اقترحتُ: «طائر؟» هز تشالنجر رأسه رافضًا وقال: «انظر عن كثب أكثر».`
          },
          {
            en: `He handed me a <span class="hl-vocab">magnifying glass</span>. The creature did have wings, but its <span class="hl-vocab">outline</span> was unlike any bird I knew. Then Challenger opened a <span class="hl-vocab">drawer</span> and removed a <span class="hl-exam">long curved bone with a piece of dried membrane attached</span>. "This was part of the creature's wing," he said. "I shot it, but most of the body was lost in the river accident." At first I thought it might come from a giant bat. Challenger pointed out the <span class="hl-vocab">structure</span> of the bone and compared it with a <span class="hl-vocab">diagram</span> in a zoology book. Slowly I understood what he was saying. "<span class="hl-exam">A pterodactyl?</span>" I whispered. "Exactly. A <span class="hl-idea">flying reptile from a prehistoric age</span>."`,
            ar: `ناولني عدسة مكبرة. كان للمخلوق أجنحة بالفعل، لكن مخطط شكله لم يكن يشبه أي طائر أعرفه. ثم فتح تشالنجر درجًا وأخرج عظمة طويلة منحنية ملتصقة بها قطعة من غشاء جاف. قال: «كان هذا جزءًا من جناح المخلوق. لقد أطلقتُ عليه النار، لكن معظم الجسد فُقد في حادث النهر». في البداية ظننتُ أنه قد يكون لخفاش عملاق، فأشار تشالنجر إلى بنية العظمة وقارنها برسم تخطيطي في كتاب لعلم الحيوان. وببطء فهمتُ ما كان يقوله، فهمستُ: «تيروداكتيل؟» فقال: «بالضبط. زاحف طائر من عصر ما قبل التاريخ».`
          },
          {
            en: `I looked again at Maple White's drawing, the damaged photograph, and the piece of wing. <span class="hl-exam">One item alone might have been explained away. Together they were much harder to dismiss.</span> "You really believe prehistoric animals are still alive on that plateau?" "I do not believe," Challenger said proudly. "I know." He explained his <span class="hl-vocab">theory</span>. The plateau had been <span class="hl-cause">cut off from the surrounding world for an extremely long time</span>. Its high cliffs formed a <span class="hl-vocab">natural barrier</span>. Plants and animals that disappeared elsewhere might have <span class="hl-vocab">survived there in isolation</span>.`,
            ar: `نظرتُ مرة أخرى إلى رسمة مابل وايت، والصورة التالفة، وقطعة الجناح. أي عنصر بمفرده كان من الممكن تبريره واستبعاده، لكنها مجتمعة كانت أصعب بكثير من أن تُرفض. سألتُ: «هل تؤمن حقًا أن حيوانات ما قبل التاريخ لا تزال حية على تلك الهضبة؟» فقال تشالنجر بفخر: «أنا لا أؤمن، بل أعلم». وشرح نظريته: لقد كانت الهضبة معزولة عن العالم المحيط لفترة طويلة للغاية، وشكلت منحدراتها العالية حاجزًا طبيعيًا، مما سمح للنباتات والحيوانات التي اختفت في أماكن أخرى بالبقاء على قيد الحياة هناك في عزلة.`
          },
          {
            en: `"Then why not return with other scientists?" I asked. <span class="hl-vocab">His expression darkened.</span> He had tried to speak publicly after returning to London, but <span class="hl-cause">people had laughed, accused him of creating false photographs, and demanded exact directions</span>. Insulted, he had refused to say more. "<span class="hl-exam">Yet truth does not become false because fools refuse to accept it</span>," he said. For the first time, I saw more than the rude, <span class="hl-vocab">explosive</span> man described by the newspapers. Challenger was proud and difficult, but he was also completely certain of what he had seen. <span class="hl-char">I believed that he believed his story. More than that, I was beginning to believe it too.</span>`,
            ar: `سألتُ: «إذن لماذا لا تعود مع علماء آخرين؟» فتغيرت ملامحه إلى الكآبة. لقد حاول التحدث علنًا بعد عودته إلى لندن، لكن الناس ضحكوا، واتهموه بتزوير الصور، وطالبوا بالاتجاهات الدقيقة. ولشعوره بالإهانة، رفض قول المزيد. قال: «ومع ذلك، فإن الحقيقة لا تصبح زيفًا لأن الحمقى يرفضون قبولها». وللمرة الأولى، رأيتُ فيه أكثر من مجرد الرجل الفظ والمنفجر الذي وصفته الصحف. كان تشالنجر فخورًا وصعب المراس، لكنه كان أيضًا على يقين تام مما رآه. صدّقتُ أنه يصدق قصته، بل أكثر من ذلك، بدأتُ أصدقها أنا أيضًا.`
          },
          {
            en: `Before I left, he told me about a <span class="hl-idea">public lecture at the Zoological Institute</span> the following evening. A well-known speaker would discuss the history of life on Earth. Challenger expected his South American claims to be mentioned. "Attend if you wish," he said. "You may find the evening educational." As I <span class="hl-vocab">stepped into</span> the London street, the ordinary traffic seemed suddenly unreal. Somewhere beyond the Atlantic, perhaps, there was a high red wall of rock where creatures from millions of years ago still moved through the forest. <span class="hl-exam">I had wanted a great adventure. Now I knew where it might begin.</span>`,
            ar: `وقبل أن أغادر، أخبرني عن محاضرة عامة في معهد علم الحيوان في المساء التالي، حيث سيناقش متحدث معروف تاريخ الحياة على الأرض، وتوقع تشالنجر أن تُذكر مزاعمه حول أمريكا الجنوبية. قال: «احضر إذا شئت، فقد تجد الأمسية مفيدة». وعندما خطوتُ إلى شارع لندن، بدت حركة المرور العادية فجأة غير حقيقية. في مكان ما وراء المحيط الأطلسي، ربما، كان هناك جدار صخري أحمر مرتفع لا تزال تتحرك فيه مخلوقات من ملايين السنين عبر الغابة. كنتُ قد أردتُ مغامرة عظيمة، والآن عرفتُ أين قد تبدأ.`
          }
        ],

        paragraphs: [
          {
            en: `The lecture hall of the <span class="hl-idea">Zoological Institute</span> was crowded. Scientists, students, journalists, and members of the public filled every seat. <span class="hl-char">Professor Challenger</span> sat near the front, impossible to miss because of his great black beard and powerful build. At first the lecture was calm. The speaker described how life had changed over millions of years. Then he mentioned <span class="hl-idea">stories of prehistoric creatures surviving in remote regions</span>. <span class="hl-cause">There was laughter from part of the audience.</span> Challenger stood at once. "<span class="hl-exam">There is nothing amusing about evidence</span>," he said loudly.`,
            ar: `كانت قاعة المحاضرات في معهد علم الحيوان مزدحمة؛ فقد ملأ العلماء والطلاب والصحفيون وأفراد الجمهور كل مقعد. جلس البروفيسور تشالنجر بالقرب من المقدمة، وكان من المستحيل ألا تلاحظه بسبب لحيته السوداء العظيمة وبنيته القوية. في البداية كانت المحاضرة هادئة، حيث وصف المتحدث كيف تغيرت الحياة على مدى ملايين السنين، ثم ذكر قصصًا عن مخلوقات ما قبل التاريخ التي نجت في مناطق نائية، فتعالت الضحكات من جزء من الجمهور. وقف تشالنجر على الفور وقال بصوت عالٍ: «لا يوجد شيء مثير للسخرية في الأدلة».`
          },
          {
            en: `The <span class="hl-vocab">chairman</span> asked him to sit down, but the room was already excited. <span class="hl-char">Professor Summerlee</span>, a <span class="hl-char">thin, elderly scientist with a sharp face and an even sharper voice</span>, challenged him directly. "If Professor Challenger has really found living prehistoric animals," Summerlee said, "Let him tell us where they are and <span class="hl-exam">provide proof that can be tested</span>." Challenger faced him. "<span class="hl-cause">Would you be willing to test it yourself?</span>" The room became silent. Summerlee lifted his chin. "Yes." "Then I will give a properly chosen <span class="hl-vocab">committee</span> enough information to reach the place. You may examine it with your own eyes." The audience <span class="hl-vocab">exploded</span> in <span class="hl-vocab">cheers</span> and questions.`,
            ar: `طلب منه رئيس الجلسة الجلوس، لكن القاعة كانت قد اشتعلت بالحماس بالفعل. تحدّاه البروفيسور سمرلي، وهو عالم نحيف مسن ذو وجه حاد وصوت أكثر حدة، بشكل مباشر قائلًا: «إذا كان البروفيسور تشالنجر قد وجد حقًا حيوانات حية من عصور ما قبل التاريخ، فليخبرنا أين هي وليقدم دليلًا يمكن اختباره». واجهه تشالنجر قائلًا: «هل أنت مستعد لاختباره بنفسك؟» ساد الصمت القاعة، فرفع سمرلي ذقنه وقال: «نعم». فقال تشالنجر: «إذن سأعطي لجنة مختارة بعناية معلومات كافية للوصول إلى المكان، ويمكنك فحصه بعينيك». فانفجر الجمهور بالهتافات والأسئلة.`
          },
          {
            en: `Challenger raised a hand. "Professor Summerlee should not travel alone. The journey will be difficult and dangerous. He will require <span class="hl-idea">younger companions</span>. Who volunteers?" I do not remember deciding to stand. One moment I was seated; the next I was on my feet. "<span class="hl-exam">Edward Malone, Daily Gazette</span>," I called. "I volunteer." Another man stood at <span class="hl-vocab">at almost the same time</span>. He was <span class="hl-char">tall, thin, and sun-browned, with calm blue eyes</span>.`,
            ar: `رفع تشالنجر يده قائلًا: «لا ينبغي للبروفيسور سمرلي أن يسافر بمفرده؛ فالرحلة ستكون صعبة وخطيرة، وسيحتاج إلى رفاق أصغر سنًا. من يتطوع؟» لا أتذكر أنني قررتُ الوقوف؛ ففي لحظة كنتُ جالسًا، وفي اللحظة التالية كنتُ واقفًا على قدميّ، فناديتُ: «إدوارد مالون، ديلي جازيت. أنا أتطوع». ووقف رجل آخر في الوقت نفسه تقريبًا؛ كان طويل القامة، نحيفًا، لوّحته الشمس، وله عينان زرقاوان هادئتان.`
          },
          {
            en: `"<span class="hl-char">Lord John Roxton</span>," he said. "I <span class="hl-idea">know the Amazon country and have traveled there before</span>." Everyone recognized the name. Lord John was famous as an <span class="hl-char">explorer, sportsman, and hunter</span>. Challenger immediately <span class="hl-vocab">proposed</span> that <span class="hl-exam">Summerlee, Roxton, and I should form the investigating party</span>. The <span class="hl-vocab">motion</span> was accepted. In a few astonishing minutes, my future had changed completely.`,
            ar: `قال: «اللورد جون روكستون. أعرف منطقة الأمازون وقد سافرتُ إليها من قبل». تعرّف الجميع على الاسم؛ فقد كان اللورد جون مشهورًا كمستكشف ورياضي وصياد. واقترح تشالنجر على الفور أن يشكل سمرلي وروكستون وأنا فريق التحقيق، وتم قبول الاقتراح. وفي بضع دقائق مذهلة، تغير مستقبلي تمامًا.`
          },
          {
            en: `Outside the hall Lord John <span class="hl-vocab">caught up with me</span>. "So we are to be traveling <span class="hl-vocab">companions</span>, Mr Malone. Come to my rooms. We should get to know one another." His home was full of <span class="hl-idea">maps, books, equipment, and trophies</span> from earlier journeys. Yet he <span class="hl-char">spoke without showing off</span>. He wanted to know whether I could <span class="hl-exam">shoot, climb, swim, and keep calm under pressure</span>. "I can learn what I do not know," I told him. "Good answer. <span class="hl-idea">South America is not a place for a man who thinks he already knows everything.</span>"`,
            ar: `خارج القاعة لحق بي اللورد جون قائلًا: «إذن سنكون رفاق سفر يا سيد مالون. تعال إلى غرفي، ينبغي أن نتعرف على بعضنا البعض». كان منزله مليئًا بالخرائط والكتب والمعدات والجوائز التذكارية من رحلات سابقة، ومع ذلك تحدث دون تفاخر. أراد أن يعرف ما إذا كنتُ أستطيع إطلاق النار والتسلق والسباحة والحفاظ على هدوئي تحت الضغط. فقلتُ له: «أستطيع تعلم ما لا أعرفه». فقال: «إجابة جيدة؛ فأمريكا الجنوبية ليست مكانًا لرجل يظن أنه يعرف كل شيء بالفعل».`
          },
          {
            en: `Lord John told me that during one of his earlier journeys, he had become <span class="hl-vocab">involved</span> in a serious <span class="hl-vocab">dispute</span> with a <span class="hl-idea">powerful rubber-trading group led by a man named Pedro Lopez</span>. Local workers were being <span class="hl-cause">treated unfairly and forced to work under terrible conditions</span>. Lord John helped them escape from the group's control and <span class="hl-cause">brought an end to Lopez's influence in the area</span>. "<span class="hl-exam">It made me some loyal friends</span>," he said, "<span class="hl-exam">and some dangerous enemies</span>. But I know the rivers, the language used by many local <span class="hl-vocab">traders</span> and guides, and the kind of men we may need. That could <span class="hl-vocab">keep us alive</span>."`,
            ar: `أخبرني اللورد جون أنه خلال إحدى رحلاته السابقة، تورط في نزاع خطير مع جماعة قوية لتجارة المطاط يقودها رجل يُدعى بيدرو لوبيز؛ حيث كان العمال المحليون يُعاملون بظلم ويُجبرون على العمل في ظروف مروعة. فساعدهم اللورد جون على الهروب من سيطرة الجماعة وأنهى نفوذ لوبيز في المنطقة. قال: «لقد أكسبني ذلك بعض الأصدقاء المخلصين، وبعض الأعداء الخطرين. لكنني أعرف الأنهار، واللغة التي يستخدمها العديد من التجار والمرشدين المحليين، ونوع الرجال الذين قد نحتاجهم، وهذا قد يُبقينا على قيد الحياة».`
          },
          {
            en: `Over the next weeks we prepared for the <span class="hl-vocab">expedition</span>. Professor Summerlee remained <span class="hl-char">openly doubtful</span> about Challenger's claims, but he was <span class="hl-char">determined to investigate them properly</span>. I respected his honesty. He might be <span class="hl-vocab">sceptical</span>, but he was <span class="hl-exam">willing to risk a long journey to discover the truth</span>.`,
            ar: `على مدى الأسابيع التالية استعددنا للرحلة الاستكشافية. ظل البروفيسور سمرلي متشككًا علنًا في مزاعم تشالنجر، لكنه كان مصممًا على التحقيق فيها بشكل سليم. احترمتُ صدقه؛ فرغم أنه قد يكون متشككًا، إلا أنه كان مستعدًا للمخاطرة برحلة طويلة لاكتشاف الحقيقة.`
          },
          {
            en: `Before we left England, I visited Gladys. "I am going to South America," I told her. "There may be real danger." For a moment her eyes <span class="hl-vocab">brightened with interest</span>. "Then you have found your chance." I wanted to say that I was doing it for her, but I remembered her earlier words. <span class="hl-exam">A brave act done only to win approval was not true courage.</span> So I simply said, "I hope I can make good use of it."`,
            ar: `قبل أن نغادر إنجلترا، زرتُ جلاديس وقلتُ لها: «أنا ذاهب إلى أمريكا الجنوبية، وقد يكون هناك خطر حقيقي». للحظة لمعت عيناها باهتمام وقالت: «إذن فقد وجدتَ فرصتك». أردتُ أن أقول إنني أفعل ذلك من أجلها، لكنني تذكرتُ كلماتها السابقة: العمل الشجاع الذي يُفعل لمجرد نيل الاستحسان ليس شجاعة حقيقية. لذلك قلتُ ببساطة: «آمل أن أحسن استغلالها».`
          },
          {
            en: `We <span class="hl-vocab">sailed across</span> the Atlantic and reached Brazil. At <span class="hl-idea">Para</span> we <span class="hl-vocab">hired</span> several men to help us. The most important was <span class="hl-char">Zambo, a huge, cheerful man who was strong, loyal, and practical</span>. We also employed two experienced river men, <span class="hl-char">Gomez and Manuel</span>, and several <span class="hl-vocab">Indigenous</span> boatmen who knew the upper waterways far better than any European traveler. Lord John chose the team carefully. Summerlee spent much of his time studying insects and plants. I <span class="hl-vocab">kept notes for</span> the Gazette. Every day the expedition <span class="hl-vocab">felt more real</span>.`,
            ar: `أبحرنا عبر المحيط الأطلسي ووصلنا إلى البرازيل. وفي «بارا» استأجرنا عدة رجال لمساعدتنا، وكان أهمهم زامبو، وهو رجل ضخم ومبتهج يتسم بالقوة والولاء والعملية. كما وظفنا رجلَي أنهار خبيرين هما جوميز ومانويل، وعددًا من الملاحين من السكان الأصليين الذين يعرفون المجاري المائية العليا أفضل بكثير من أي مسافر أوروبي. اختار اللورد جون الفريق بعناية، وقضى سمرلي معظم وقته في دراسة الحشرات والنباتات، بينما كنتُ أدوّن الملاحظات لصحيفة «جازيت». وفي كل يوم كانت الرحلة الاستكشافية تبدو أكثر واقعية.`
          },
          {
            en: `Our written <span class="hl-vocab">instructions</span> from Challenger were to be opened at <span class="hl-idea">Manaos at exactly noon on 15 July</span>. The <span class="hl-vocab">envelope</span> remained <span class="hl-vocab">sealed</span> during the journey. At last the day arrived. We sat around a table in a <span class="hl-vocab">shaded</span> house outside Manaos. Lord John placed his watch beside the envelope. "Noon," he said, and cut it open. <span class="hl-exam">Inside was a single sheet of paper. It was blank.</span> Summerlee stared at it. "This is <span class="hl-vocab">ridiculous</span>."`,
            ar: `كان من المقرر فتح تعليماتنا المكتوبة من تشالنجر في «ماناوس» في تمام الساعة الثانية عشرة ظهرًا يوم 15 يوليو، وظل المظروف مختومًا طوال الرحلة. وأخيرًا جاء اليوم الموعود؛ جلسنا حول طاولة في منزل مظلل خارج ماناوس، ووضع اللورد جون ساعته بجانب المظروف وقال: «الظهر»، ثم فتحه. كانت بداخله ورقة واحدة، وكانت بيضاء فارغة تمامًا. حدّق سمرلي فيها قائلًا: «هذا سخيف».`
          },
          {
            en: `Before anyone could answer, a deep familiar voice came from the doorway. "<span class="hl-vocab">On the contrary</span>, Professor Summerlee. It is perfectly sensible." <span class="hl-idea">Professor Challenger walked into the room.</span> He had <span class="hl-cause">secretly traveled to Brazil and planned to guide us himself</span>. <span class="hl-exam">No written directions, he explained, could be as reliable as his own memory.</span> He had kept his decision private because <span class="hl-cause">he did not want arguments, reporters, or curious travelers following him</span>.`,
            ar: `وقبل أن يتمكن أحد من الإجابة، جاء صوت عميق مألوف من عند المدخل قائلًا: «على العكس من ذلك يا بروفيسور سمرلي، إنه أمر منطقي تمامًا». ودخل البروفيسور تشالنجر إلى الغرفة. لقد سافر سرًا إلى البرازيل وخطط لقيادتنا بنفسه، موضحًا أنه لا توجد توجيهات مكتوبة يمكن أن تكون موثوقة مثل ذاكرته الشخصية. وكان قد أبقى قراره سرًا لأنه لم يُرد جدالات أو صحفيين أو مسافرين فضوليين يتبعونه.`
          },
          {
            en: `Summerlee looked <span class="hl-vocab">horrified</span>. "You mean I must spend the whole journey with you?" "The scientific value of my <span class="hl-vocab">company</span> will more than <span class="hl-vocab">compensate</span> for any personal <span class="hl-vocab">discomfort</span>," Challenger replied. Lord John laughed. "Then our team is complete." Challenger spread a map across the table, though the final <span class="hl-vocab">destination</span> was not marked. "We leave tomorrow," he said. "From this point onwards, we are going into a country that very few outsiders have seen. Later we will go beyond even that." I looked around the table at the four of us - Challenger, Summerlee, Lord John, and myself. <span class="hl-char">We were different in age, character, and purpose.</span> Yet we now shared one question. <span class="hl-exam">Was there truly a lost world waiting beyond the Amazon?</span>`,
            ar: `بدا سمرلي مرعوبًا وقال: «هل تقصد أنني يجب أن أقضي الرحلة بأكملها معك؟» فأجاب تشالنجر: «إن القيمة العلمية لصحبتي ستعوض بأكثر من اللازم عن أي انزعاج شخصي». ضحك اللورد جون وقال: «إذن فقد اكتمل فريقنا». بسط تشالنجر خريطة على الطاولة، رغم أن الوجهة النهائية لم تكن محددة عليها، وقال: «سنغادر غدًا؛ فمن هذه النقطة فصاعدًا سندخل بلادًا لم يرها سوى قلة قليلة من الغرباء، ولاحقًا سنذهب إلى ما هو أبعد من ذلك». نظرتُ حول الطاولة إلينا نحن الأربعة — تشالنجر، وسمرلي، واللورد جون، وأنا. كنا مختلفين في العمر والشخصية والهدف، ولكننا الآن نتشارك سؤالًا واحدًا: هل كان هناك حقًا عالم مفقود ينتظر وراء الأمازون؟`
          }

      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initChapterMCQ(ch) {
      const rawMcqs = CHAPTERS_DATA[ch].mcqs;
      appState.mcqShuffled[ch] = rawMcqs.map((item) => {
        const mappedOptions = item.options.map((optText, idx) => ({
          text: optText,
          isCorrect: idx === item.correct
        }));
        return {
          q: item.q,
          options: fisherYatesShuffle(mappedOptions),
          explanation: item.explanation
        };
      });
    }

    function initChapterEssay(ch) {
      const total = CHAPTERS_DATA[ch].essays.length;
      const indices = Array.from({ length: total }, (_, i) => i);
      appState.essayState[ch] = {
        queue: indices,
        mastered: [],
        ratings: {},
        userDrafts: {},
        history: []
      };
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          appState = { ...appState, ...parsed };
        }
      } catch (e) {
        console.warn('Could not load saved state:', e);
      }

      // Ensure MCQs are initialized and shuffled on fresh page load if not answered yet,
      // or always shuffle unanswered MCQs on page load per strict Fisher-Yates requirement
      [1, 2, 3].forEach((ch) => {
        if (!appState.mcqShuffled[ch] || Object.keys(appState.mcqAnswers[ch] || {}).length === 0) {
          initChapterMCQ(ch);
        }
        if (!appState.essayState[ch] || !Array.isArray(appState.essayState[ch].queue)) {
          initChapterEssay(ch);
        }
      });

      applyTheme(appState.theme);
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.warn('Could not save state:', e);
      }
      updateProgressUI();
    }

    // =========================================================================
    // THEME & SIDEBAR CONTROLS
    // =========================================================================

    function applyTheme(theme) {
      const html = document.documentElement;
      if (theme === 'dark') {
        html.classList.add('dark');
        document.getElementById('mobileThemeIcon').textContent = '☀️';
        document.getElementById('desktopThemeIcon').textContent = '☀️';
      } else {
        html.classList.remove('dark');
        document.getElementById('mobileThemeIcon').textContent = '🌙';
        document.getElementById('desktopThemeIcon').textContent = '🌙';
      }
    }

    function toggleTheme() {
      appState.theme = appState.theme === 'dark' ? 'light' : 'dark';
      applyTheme(appState.theme);
      saveState();
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');
      const isClosed = sidebar.classList.contains('-translate-x-full');
      if (isClosed) {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }
    }

    function resetAllProgress() {
      if (!confirm('Are you sure you want to reset all quiz scores, flashcards, and spaced-repetition essay progress?')) return;
      localStorage.removeItem(STORAGE_KEY);
      appState.mcqAnswers = { 1: {}, 2: {}, 3: {} };
      appState.flashcardIndex = { 1: 0, 2: 0, 3: 0 };
      [1, 2, 3].forEach((ch) => {
        initChapterMCQ(ch);
        initChapterEssay(ch);
      });
      saveState();
      renderApp();
    }

    // =========================================================================
    // PROGRESS TRACKING
    // =========================================================================

    function getChapterProgress(ch) {
      // Each chapter has 10 MCQs + 20 Essays = 30 total mastery items
      const mcqAns = appState.mcqAnswers[ch] || {};
      const mcqShuf = appState.mcqShuffled[ch] || [];
      let correctMcqs = 0;
      Object.keys(mcqAns).forEach((qIdx) => {
        const chosen = mcqAns[qIdx];
        if (mcqShuf[qIdx] && mcqShuf[qIdx].options[chosen]?.isCorrect) {
          correctMcqs++;
        }
      });
      const masteredEssays = (appState.essayState[ch]?.mastered || []).length;
      const done = correctMcqs + masteredEssays;
      const total = 30;
      const pct = Math.round((done / total) * 100);
      return { done, total, pct, correctMcqs, masteredEssays };
    }

    function updateProgressUI() {
      let totalDone = 0;
      let totalAll = 90;
      [1, 2, 3].forEach((ch) => {
        const p = getChapterProgress(ch);
        totalDone += p.done;
        const badge = document.getElementById(`badge-ch-${ch}`);
        if (badge) {
          badge.textContent = `${p.pct}%`;
          if (p.pct === 100) {
            badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300';
          } else {
            badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300';
          }
        }
      });

      const globalPct = Math.round((totalDone / totalAll) * 100);
      const bar = document.getElementById('globalProgressBar');
      const txt = document.getElementById('globalProgressText');
      const sub = document.getElementById('globalProgressSub');
      if (bar) bar.style.width = `${globalPct}%`;
      if (txt) txt.textContent = `${globalPct}%`;
      if (sub) sub.textContent = `${totalDone} / ${totalAll} tasks mastered across 3 chapters`;

      // Highlight active sidebar button
      [0, 1, 2, 3].forEach((id) => {
        const btn = document.getElementById(`nav-ch-${id}`);
        if (!btn) return;
        if (appState.currentView === id) {
          btn.className = 'nav-btn w-full text-left px-3.5 py-3 rounded-xl flex items-center gap-3 transition font-bold text-sm bg-royal-600 text-white shadow-md shadow-indigo-500/20';
        } else {
          btn.className = 'nav-btn w-full text-left px-3.5 py-3 rounded-xl flex items-center gap-3 transition font-semibold text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/80';
        }
      });
    }

              <span>⏳</span> Chronological Chapter Timeline
            </h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Step-by-step sequence of events in exact book order.</p>

            <div class="relative border-l-2 border-indigo-200 dark:border-indigo-900 ml-3.5 space-y-5">
              ${data.summaryPoints.map((pt, idx) => `
                <div class="relative pl-7">
                  <span class="absolute -left-[13px] top-0.5 w-6 h-6 rounded-full bg-royal-600 text-white text-xs font-extrabold flex items-center justify-center shadow-xs">
                    ${idx + 1}
                  </span>
                  <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/70 dark:border-slate-700/70 text-sm text-slate-700 dark:text-slate-200 leading-relaxed">
                    ${pt}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // TAB 3: 3D INTERACTIVE FLASHCARDS
    // =========================================================================

    function renderFlashcardsTab(ch) {
      const cards = CHAPTERS_DATA[ch].flashcards;
      const idx = appState.flashcardIndex[ch] || 0;
      const card = cards[idx];
      const flipped = appState.flashcardFlipped;

      return `
        <div class="max-w-2xl mx-auto space-y-6">
          <div class="text-center">
            <h2 class="text-xl font-extrabold">3D Active Recall Flashcards — Chapter ${ch}</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400">Click the card to flip between the Question and the Answer.</p>
          </div>

          <!-- Card Counter -->
          <div class="flex items-center justify-between text-xs font-bold text-slate-500 dark:text-slate-400 px-1">
            <span>Card ${idx + 1} of ${cards.length}</span>
            <span>Click card to flip ↻</span>
          </div>

          <!-- 3D Perspective Card -->
          <div onclick="flipFlashcard()" class="perspective-1000 cursor-pointer select-none h-72 sm:h-80">
            <div class="relative w-full h-full transition-transform duration-500 transform-style-3d ${flipped ? 'rotate-y-180' : ''}">
              <!-- Front -->
              <div class="absolute inset-0 backface-hidden rounded-3xl bg-gradient-to-br from-royal-600 via-indigo-700 to-purple-800 text-white p-8 flex flex-col items-center justify-center text-center shadow-xl">
                <span class="px-3 py-1 rounded-full bg-white/15 text-xs font-bold uppercase tracking-wider mb-4">Question / Term</span>
                <p class="text-lg sm:text-xl font-extrabold leading-relaxed">${card.q}</p>
                <span class="mt-6 text-xs text-indigo-200">Tap to reveal answer</span>
              </div>

              <!-- Back -->
              <div class="absolute inset-0 backface-hidden rotate-y-180 rounded-3xl bg-white dark:bg-slate-900 border-2 border-emerald-500 p-8 flex flex-col items-center justify-center text-center shadow-xl">
                <span class="px-3 py-1 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 text-xs font-bold uppercase tracking-wider mb-4">Answer / Explanation</span>
                <p class="text-base sm:text-lg font-semibold text-slate-800 dark:text-slate-100 leading-relaxed">${card.a}</p>
                <span class="mt-6 text-xs text-slate-400">Tap to flip back</span>
              </div>
            </div>
          </div>

          <!-- Controls -->
          <div class="flex items-center justify-between gap-4">
            <button onclick="prevFlashcard(${ch})" class="flex-1 py-3 px-4 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 font-bold text-sm hover:border-indigo-500 transition">
              ← Previous
            </button>
            <button onclick="flipFlashcard()" class="py-3 px-6 rounded-xl bg-indigo-100 dark:bg-indigo-950 text-royal-700 dark:text-indigo-300 font-bold text-sm hover:bg-indigo-200 transition">
              Flip Card
            </button>
            <button onclick="nextFlashcard(${ch})" class="flex-1 py-3 px-4 rounded-xl bg-royal-600 text-white font-bold text-sm hover:bg-royal-700 transition shadow-md">
              Next →
            </button>
          </div>
        </div>
      `;
    }

    function flipFlashcard() {
      appState.flashcardFlipped = !appState.flashcardFlipped;
      renderApp();
    }

    function prevFlashcard(ch) {
      const len = CHAPTERS_DATA[ch].flashcards.length;
      appState.flashcardIndex[ch] = ((appState.flashcardIndex[ch] || 0) - 1 + len) % len;
      appState.flashcardFlipped = false;
      saveState();
      renderApp();
    }

    function nextFlashcard(ch) {
      const len = CHAPTERS_DATA[ch].flashcards.length;
      appState.flashcardIndex[ch] = ((appState.flashcardIndex[ch] || 0) + 1) % len;
      appState.flashcardFlipped = false;
      saveState();
      renderApp();
    }

    // =========================================================================
    // TAB 4: RANDOMIZED MULTIPLE-CHOICE QUIZ (10 PER CHAPTER, FISHER-YATES)
    // =========================================================================

    function renderMCQTab(ch) {
      const questions = appState.mcqShuffled[ch];
      const userAns = appState.mcqAnswers[ch] || {};
      const answeredCount = Object.keys(userAns).length;
      let score = 0;
      Object.keys(userAns).forEach(idx => {
        if (questions[idx].options[userAns[idx]]?.isCorrect) score++;
      });

      return `
        <div class="space-y-6">
          <!-- Score Banner -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-xs">
            <div>
              <h2 class="text-lg font-extrabold">Chapter ${ch} Comprehension Quiz (10 Questions)</h2>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Options are shuffled dynamically via Fisher-Yates. Answers lock once selected.</p>
            </div>
            <div class="flex items-center gap-4">
              <div class="px-4 py-2 rounded-xl bg-indigo-50 dark:bg-indigo-950/70 border border-indigo-200 dark:border-indigo-800 text-center">
                <span class="block text-[10px] font-bold uppercase text-indigo-600 dark:text-indigo-400">Score</span>
                <span class="text-lg font-extrabold text-royal-700 dark:text-indigo-200">${score} / 10</span>
              </div>
              <button onclick="retakeMCQ(${ch})" class="px-4 py-2.5 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 hover:bg-rose-100 hover:text-rose-700 dark:hover:bg-rose-950 dark:hover:text-rose-300 transition">
                ↻ Retake &amp; Shuffle
              </button>
            </div>
          </div>

          <!-- Questions List -->
          <div class="space-y-5">
            ${questions.map((item, qIdx) => {
              const chosenIdx = userAns[qIdx];
              const isAnswered = chosenIdx !== undefined;
              const letters = ['A', 'B', 'C', 'D'];

              return `
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-xs">
                  <div class="flex items-start gap-3 mb-4">
                    <span class="w-7 h-7 shrink-0 rounded-lg bg-royal-600 text-white text-xs font-extrabold flex items-center justify-center mt-0.5">
                      ${qIdx + 1}
                    </span>
                    <h3 class="font-bold text-base text-slate-900 dark:text-white leading-snug">${item.q}</h3>
                  </div>

                  <div class="space-y-2.5">
                    ${item.options.map((opt, oIdx) => {
                      let btnClass = 'border-slate-200 dark:border-slate-700 hover:border-indigo-400 dark:hover:border-indigo-500 bg-slate-50/50 dark:bg-slate-800/40';
                      let icon = '';

                      if (isAnswered) {
                        if (opt.isCorrect) {
                          btnClass = 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/60 text-emerald-900 dark:text-emerald-100 font-bold animate-pop';
                          icon = '<span class="text-emerald-600 dark:text-emerald-400 font-extrabold text-base">✓</span>';
                        } else if (oIdx === chosenIdx && !opt.isCorrect) {
                          btnClass = 'border-rose-500 bg-rose-50 dark:bg-rose-950/60 text-rose-900 dark:text-rose-100 font-bold';
                          icon = '<span class="text-rose-600 dark:text-rose-400 font-extrabold text-base">✕</span>';
                        } else {
                          btnClass = 'border-slate-200 dark:border-slate-800 opacity-55';
                        }
                      }

                      return `
                        <button
                          onclick="answerMCQ(${ch}, ${qIdx}, ${oIdx})"
                          ${isAnswered ? 'disabled' : ''}
                          class="w-full text-left p-3.5 rounded-xl border-2 transition flex items-center justify-between gap-3 text-sm ${btnClass} ${isAnswered ? 'cursor-default' : 'cursor-pointer'}"
                        >
                          <div class="flex items-center gap-3">
                            <span class="w-6 h-6 rounded-md bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 text-xs font-extrabold flex items-center justify-center shrink-0">
                              ${letters[oIdx]}
                            </span>
                            <span>${opt.text}</span>
                          </div>
                          ${icon}
                        </button>
                      `;
                    }).join('')}
                  </div>

                  ${isAnswered ? `
                    <div class="mt-4 p-3.5 rounded-xl bg-indigo-50/70 dark:bg-indigo-950/40 border border-indigo-200/80 dark:border-indigo-800/60 text-xs text-slate-700 dark:text-slate-200 leading-relaxed">
                      <strong class="text-royal-700 dark:text-indigo-300">Explanation:</strong> ${item.explanation}
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function answerMCQ(ch, qIdx, oIdx) {
      if (appState.mcqAnswers[ch][qIdx] !== undefined) return;
      appState.mcqAnswers[ch][qIdx] = oIdx;
      saveState();
      renderApp();
    }

    function retakeMCQ(ch) {
      appState.mcqAnswers[ch] = {};
      initChapterMCQ(ch);
      saveState();
      renderApp();
    }

    // =========================================================================
    // TAB 5: SMART SPACED-REPETITION ESSAY SYSTEM (20 PER CHAPTER)
    // =========================================================================

    function renderEssayTab(ch) {
      const essays = CHAPTERS_DATA[ch].essays;
      const state = appState.essayState[ch];
      const total = essays.length; // 20
      const masteredCount = state.mastered.length;
      const remainingCount = state.queue.length;
      const masteryPct = Math.round((masteredCount / total) * 100);

      // Current active question is the front of the queue
      const currentIdx = state.queue.length > 0 ? state.queue[0] : null;
      const currentEssay = currentIdx !== null ? essays[currentIdx] : null;
      const prevRating = currentIdx !== null ? state.ratings[currentIdx] : null;
      const draftText = currentIdx !== null ? (state.userDrafts[currentIdx] || '') : '';

      return `
        <div class="space-y-6">
          <!-- Spaced Repetition Mastery Dashboard -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-xs">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
              <div>
                <h2 class="text-lg font-extrabold flex items-center gap-2">
                  <span>🎯</span> Smart Spaced-Repetition Essay Trainer (20 Questions)
                </h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                  Rate your answer after viewing the concise model answer. Unmastered questions repeat automatically until you master all 20!
                </p>
              </div>
              <button onclick="resetChapterEssays(${ch})" class="self-start sm:self-center px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 hover:bg-rose-100 hover:text-rose-700 dark:hover:bg-rose-950 dark:hover:text-rose-300 transition">
                ↻ Restart Deck
              </button>
            </div>

            <!-- Stats Counters -->
            <div class="grid grid-cols-3 gap-3 mb-4">
              <div class="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-900/60 text-center">
                <span class="block text-[11px] font-bold text-emerald-700 dark:text-emerald-400">Mastered (Excellent)</span>
                <span class="text-xl font-extrabold text-emerald-800 dark:text-emerald-200">${masteredCount} / ${total}</span>
              </div>
              <div class="p-3 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900/60 text-center">
                <span class="block text-[11px] font-bold text-amber-700 dark:text-amber-400">Remaining in Queue</span>
                <span class="text-xl font-extrabold text-amber-800 dark:text-amber-200">${remainingCount}</span>
              </div>
              <div class="p-3 rounded-xl bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-900/60 text-center">
                <span class="block text-[11px] font-bold text-indigo-700 dark:text-indigo-400">Chapter Mastery</span>
                <span class="text-xl font-extrabold text-indigo-800 dark:text-indigo-200">${masteryPct}%</span>
              </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full h-2.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
              <div class="h-full bg-gradient-to-r from-indigo-600 to-emerald-500 transition-all duration-500" style="width: ${masteryPct}%"></div>
            </div>
          </div>

          ${currentEssay !== null ? `
            <!-- Active Essay Card -->
            <div class="bg-white dark:bg-slate-900 border-2 border-indigo-200 dark:border-indigo-900/70 rounded-3xl p-6 sm:p-8 shadow-md">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                <div class="flex items-center gap-2">
                  <span class="px-3 py-1 rounded-full text-xs font-extrabold bg-royal-600 text-white">
                    Question #${currentIdx + 1}
                  </span>
                  ${prevRating ? `
                    <span class="px-2.5 py-1 rounded-full text-[11px] font-bold ${
                      prevRating === 'incorrect'
                        ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300'
                        : 'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300'
                    }">
                      ↻ Spaced Review (${prevRating === 'incorrect' ? 'Previously Incorrect' : 'Needs Improvement'})
                    </span>
                  ` : `
                    <span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                      New Question
                    </span>
                  `}
                </div>

                <!-- Translate Question Button -->
                <button onclick="toggleEssayTranslation()" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-amber-100 hover:bg-amber-200 dark:bg-amber-950/80 dark:hover:bg-amber-900 text-amber-900 dark:text-amber-200 border border-amber-300 dark:border-amber-800 transition flex items-center gap-1.5">
                  <span>🌐</span> Translate Question
                </button>
              </div>

              <!-- English Question -->
              <h3 class="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white leading-snug mb-3">
                ${currentEssay.q}
              </h3>

              <!-- Inline Arabic Question Translation Box (Hidden until toggled) -->
              <div id="essayTranslationBox" class="hidden mb-4 p-3.5 rounded-xl bg-amber-50/90 dark:bg-amber-950/50 border-r-4 border-amber-500 text-right font-arabic text-sm sm:text-base font-bold text-amber-950 dark:text-amber-100" dir="rtl" lang="ar">
                ${currentEssay.ar}
              </div>

              <!-- Optional Student Answer Input -->
              <div class="mb-4">
                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5">
                  Your Practice Answer (Optional — test yourself before revealing):
                </label>
                <textarea
                  id="essayUserInput"
                  oninput="saveEssayDraft(${ch}, ${currentIdx}, this.value)"
                  rows="3"
                  placeholder="Write your concise English answer here..."
                  class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/70 p-3.5 text-sm text-slate-800 dark:text-slate-100 focus:outline-hidden focus:ring-2 focus:ring-royal-500 transition"
                >${draftText}</textarea>
              </div>

              <!-- Show Model Answer Button -->
              <button onclick="revealModelAnswer()" id="showModelBtn" class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-royal-600 hover:bg-royal-700 text-white font-bold text-sm shadow-sm transition">
                👁️ Show Model Answer
              </button>

              <!-- Smooth Accordion Model Answer + Self-Evaluation -->
              <div id="modelAnswerAccordion" class="accordion-content mt-4">
                <div class="accordion-inner">
                  <div class="p-5 rounded-2xl bg-emerald-50/90 dark:bg-emerald-950/40 border border-emerald-300 dark:border-emerald-800/80 space-y-4">
                    <div>
                      <span class="inline-block text-[11px] font-extrabold uppercase tracking-wider text-emerald-700 dark:text-emerald-400 mb-1">
                        ✓ Concise Model Answer
                      </span>
                      <p class="text-sm sm:text-base font-bold text-emerald-950 dark:text-emerald-100 leading-relaxed">
                        ${currentEssay.a}
                      </p>
                    </div>

                    <div class="pt-3 border-t border-emerald-200 dark:border-emerald-800/60">
                      <p class="text-xs font-extrabold text-slate-700 dark:text-slate-200 mb-2.5">
                        Rate your answer to schedule smart repetition:
                      </p>
                      <div class="grid sm:grid-cols-3 gap-2.5">
                        <button onclick="rateEssay(${ch}, 'excellent')" class="p-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs text-center shadow-xs transition">
                          🌟 Excellent — ممتازة
                          <span class="block text-[10px] font-normal opacity-90 mt-0.5">Mastered (Remove from queue)</span>
                        </button>
                        <button onclick="rateEssay(${ch}, 'improve')" class="p-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs text-center shadow-xs transition">
                          🛠️ Needs Improvement — تحتاج تعديل
                          <span class="block text-[10px] font-normal opacity-90 mt-0.5">Repeat after ~4 questions</span>
                        </button>
                        <button onclick="rateEssay(${ch}, 'incorrect')" class="p-3 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs text-center shadow-xs transition">
                          ❌ Incorrect — خاطئة
                          <span class="block text-[10px] font-normal opacity-90 mt-0.5">Repeat after 1 question</span>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          ` : `
            <!-- Completion Celebration Banner -->
            <div class="rounded-3xl bg-gradient-to-br from-emerald-600 to-teal-700 text-white p-8 text-center shadow-xl">
              <div class="text-5xl mb-3">🏆</div>
              <h3 class="text-2xl font-extrabold mb-2">Congratulations! Chapter ${ch} Fully Mastered!</h3>
              <p class="text-emerald-100 text-sm max-w-lg mx-auto mb-6">
                You have rated all 20 essay questions for Chapter ${ch} as <strong>Excellent</strong>. You can review all questions below or restart the deck anytime.
              </p>
              <button onclick="resetChapterEssays(${ch})" class="px-5 py-2.5 rounded-xl bg-white text-emerald-800 font-extrabold text-sm hover:bg-emerald-50 transition shadow-md">
                ↻ Practice All 20 Again
              </button>
            </div>
          `}

          <!-- Review All 20 Questions Overview List -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-xs">
            <h3 class="text-base font-extrabold mb-1">All 20 Chapter ${ch} Essay Questions &amp; Mastery Status</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">Click any question to view its model answer or jump to it in the queue.</p>
            <div class="space-y-2.5">
              ${essays.map((e, i) => {
                const isMastered = state.mastered.includes(i);
                const rating = state.ratings[i];
                let badge = '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-slate-100 dark:bg-slate-800 text-slate-500">Pending</span>';
                if (isMastered) badge = '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300">🌟 Mastered</span>';
                else if (rating === 'improve') badge = '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300">🛠️ Reviewing</span>';
                else if (rating === 'incorrect') badge = '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-300">❌ Due Soon</span>';

                return `
                  <details class="group rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/40 p-3.5">
                    <summary class="flex items-center justify-between gap-3 cursor-pointer list-none font-semibold text-xs sm:text-sm text-slate-800 dark:text-slate-100">
                      <span><strong class="text-royal-600 dark:text-indigo-400 mr-1.5">Q${i + 1}.</strong> ${e.q}</span>
                      <span class="shrink-0">${badge}</span>
                    </summary>
                    <div class="mt-3 pt-3 border-t border-slate-200 dark:border-slate-700 space-y-2 text-xs">
                      <p dir="rtl" lang="ar" class="font-arabic text-amber-700 dark:text-amber-300 font-bold text-right">${e.ar}</p>
                      <p class="text-emerald-800 dark:text-emerald-300 font-bold">Model Answer: <span class="font-normal text-slate-700 dark:text-slate-200">${e.a}</span></p>
                    </div>
                  </details>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function toggleEssayTranslation() {
      const box = document.getElementById('essayTranslationBox');
      if (box) box.classList.toggle('hidden');
    }

    function revealModelAnswer() {
      const acc = document.getElementById('modelAnswerAccordion');
      if (acc) acc.classList.add('open');
    }

    function saveEssayDraft(ch, idx, val) {
      appState.essayState[ch].userDrafts[idx] = val;
      saveState();
    }

    function rateEssay(ch, rating) {
      const state = appState.essayState[ch];
      if (!state || state.queue.length === 0) return;

      const currentIdx = state.queue.shift(); // Remove from front
      state.ratings[currentIdx] = rating;
      state.history.push({ idx: currentIdx, rating, time: Date.now() });

      if (rating === 'excellent') {
        if (!state.mastered.includes(currentIdx)) {
          state.mastered.push(currentIdx);
        }
      } else if (rating === 'improve') {
        // Re-insert after ~4 other questions (index 4 or end of queue)
        const insertPos = Math.min(4, state.queue.length);
        state.queue.splice(insertPos, 0, currentIdx);
      } else if (rating === 'incorrect') {
        // Re-insert after 1 other question (index 1 or end of queue)
        const insertPos = Math.min(1, state.queue.length);
        state.queue.splice(insertPos, 0, currentIdx);
      }

      saveState();
      renderApp();
    }

    function resetChapterEssays(ch) {
      initChapterEssay(ch);
      saveState();
      renderApp();
    }

    // =========================================================================
    // MAIN RENDER LOOP
    // =========================================================================

    function renderApp() {
      const container = document.getElementById('appContent');
      if (!container) return;

      if (appState.currentView === 0) {
        container.innerHTML = renderIntro();
      } else {
        container.innerHTML = renderChapterView(appState.currentView);
      }
      updateProgressUI();
    }

    // Initialize Application
    loadState();
    renderApp();
  </script>
</body>
</html>
